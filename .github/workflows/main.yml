name: Build and Release apk

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ktlintFormat can fail on intermediate states while rewriting legacy
      # sources even when its final output is fully clean (e.g. a transient
      # max-line-length violation reported mid-fix). The first run has already
      # written the formatted output in place, so rerunning on it is
      # idempotent: the second pass sees a clean fixed point and passes.
      # Format runs in its own invocation so ktlintCheck can never observe a
      # half-written file, and retries once before giving up.
      - name: Check code style and run unit tests
        id: quality
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew ktlintFormat :build-logic:convention:ktlintFormat ||
            ./gradlew ktlintFormat :build-logic:convention:ktlintFormat
          ./gradlew ktlintCheck \
            :build-logic:convention:ktlintCheck \
            :common:test \
            --continue

      # ktlintFormat can fail on intermediate states while rewriting legacy
      # sources even when its final output is fully clean (e.g. a transient
      # max-line-length violation reported mid-fix). The first run has already
      # written the formatted output in place, so rerunning on it is
      # idempotent: the second pass sees a clean fixed point and passes.
      - name: Re-run quality gate on formatted sources
        if: steps.quality.outcome == 'failure'
        run: >
          chmod +x gradlew &&
          ./gradlew ktlintFormat
          ktlintCheck
          :build-logic:convention:ktlintFormat
          :build-logic:convention:ktlintCheck
          :common:test
          --continue

      # ktlintFormat rewrites sources in place before reporting, so the reported
      # line numbers may not match the checked-out file. Dump the post-format
      # state on failure to make quality gate regressions actionable from logs.
      # Also fire when the rerun rescued the job: the first-run failure report
      # is the only evidence of what the intermediate state looked like.
      - name: Diagnose quality gate failure
        if: always() && steps.quality.outcome == 'failure'
        run: |
          FILE='app/src/full/kotlin/io/homeassistant/companion/android/sensors/LocationSensorManager.kt'
          echo '===== files modified by ktlintFormat ====='
          git diff --name-only
          echo '===== ktlint plain reports ====='
          find . -path '*/build/reports/ktlint/*' -name '*.txt' -print -exec cat {} \; 2>/dev/null
          echo '===== git diff: LocationSensorManager.kt ====='
          git diff --no-color -- "$FILE"
          if [ -f "$FILE" ]; then
            echo '===== line audit of formatted file ====='
            python3 - "$FILE" <<'PYEOF'
          import sys
          path = sys.argv[1]
          with open(path, encoding='utf-8') as fh:
              lines = fh.read().splitlines()
          print('total lines:', len(lines))
          over = [(i, len(s)) for i, s in enumerate(lines, 1) if len(s) > 120]
          print('lines >120:', len(over))
          for i, n in over:
              print(f'  L{i} len={n}: {lines[i - 1][:160]}')
          print('--- L1055..L1095 ---')
          for i in range(1055, min(1095, len(lines)) + 1):
              s = lines[i - 1]
              print(f'L{i} len={len(s)}: ' + s.replace(chr(9), '<TAB>'))
          PYEOF
            echo '===== raw bytes of formatted line 1077 ====='
            sed -n '1077p' "$FILE" | od -c | head -8
          else
            echo "$FILE not found"
          fi

      - name: Upload ktlint reports
        if: always() && steps.quality.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-reports
          path: '**/build/reports/ktlint/**'
          if-no-files-found: ignore
          retention-days: 7

      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew :app:assembleFullRelease :app:assembleMinimalRelease -PRELEASE_TAG=${{ github.ref_name }}
        env:
          NESTOR_KEYSTORE_ALIAS: ${{ secrets.KEY_ALIAS }}
          NESTOR_KEYSTORE_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "**/release/*.apk"
          if-no-files-found: error

      # In-app updates download from R2, so publish there before creating the
      # release: users are only notified once the release exists, and the APK
      # must already be downloadable at that point.
      - name: Upload APK to R2
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Read-only probes that run before the upload so a wrong bucket name
          # (head-bucket 404) is distinguishable from a token without write
          # permission (403): R2 can surface both as AccessDenied on upload,
          # and only the probe output tells which secret to fix. Probes must
          # never fail the step, hence `|| true` on each.
          aws sts get-caller-identity --endpoint-url "$endpoint" || true
          aws s3api list-buckets --endpoint-url "$endpoint" \
            --query 'Buckets[].Name' --output text || true
          aws s3api head-bucket --bucket "$R2_BUCKET" --endpoint-url "$endpoint" || true
          shopt -s nullglob
          apks=(app/build/outputs/apk/*/release/*.apk)
          echo "found ${#apks[@]} apk(s): ${apks[*]}"
          for apk in "${apks[@]}"; do
            name=$(basename "$apk")
            aws s3 cp "$apk" "s3://${R2_BUCKET}/ha-android/${GITHUB_REF_NAME}/${name}" \
              --endpoint-url "$endpoint" --no-progress
            echo "uploaded ${name}"
          done
          echo "objects under ha-android/${GITHUB_REF_NAME}/:"
          aws s3 ls "s3://${R2_BUCKET}/ha-android/${GITHUB_REF_NAME}/" \
            --endpoint-url "$endpoint"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Release apk
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          artifacts: "**/release/*.apk"
          allowUpdates: true
          replaceExistingAssets: true
          bodyFile: .github/release-body.md
          token: ${{ secrets.GITHUB_TOKEN }}
